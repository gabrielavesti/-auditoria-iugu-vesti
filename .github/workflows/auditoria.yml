name: Auditoria diaria Iugu x Marcas e Planos

on:
  schedule:
    # 08:00 UTC = 05:00 horario de Brasilia (BRT, UTC-3, sem horario de verao)
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar auditoria
        env:
          IUGU_MASTER_TOKEN: ${{ secrets.IUGU_MASTER_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python main.py
